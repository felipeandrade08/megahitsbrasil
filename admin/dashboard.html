<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel — MegaHitsBrasil</title><style>
:root{--bg:#07060b;--card:#111019;--line:#25222d;--text:#fff;--muted:#9c97a6;--pink:#ff1b9b;--purple:#7c43ff;--green:#25d366;--red:#ff6b6b;--yellow:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(700px 450px at 10% 0%,#26104a55,transparent),#07060b;color:var(--text);font:14px Inter,Arial,sans-serif}.wrap{width:min(1250px,calc(100% - 28px));margin:auto}.header{border-bottom:1px solid var(--line);position:sticky;top:0;background:#07060bdd;backdrop-filter:blur(15px);z-index:10}.nav{height:70px;display:flex;justify-content:space-between;align-items:center}.logo{width:165px}.btn{border:1px solid var(--line);background:#17151e;color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:800}.btn:hover{border-color:#7040d8}.danger{color:#ff9b9b}.page{padding:30px 0 60px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.ey{font-size:11px;font-weight:900;letter-spacing:2px;color:#a98cff}.top h1{margin:5px 0;font-size:30px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.stat span{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.7px}.stat strong{display:block;font-size:23px;margin-top:9px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.search{flex:1;min-width:250px;background:#0d0c12;border:1px solid var(--line);color:#fff;border-radius:10px;padding:12px}.select{background:#0d0c12;color:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.panelhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1050px}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid #211f28;vertical-align:top}.table th{font-size:10px;color:#817c89}.customer strong,.customer span{display:block}.customer span{font-size:11px;color:var(--muted);margin-top:3px}.pill{display:inline-block;padding:6px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#292531}.pill.pending_pix{color:var(--yellow)}.pill.paid{color:#78f2a1}.pill.rejected{color:#ff9696}.proof{color:#9bc8ff;background:#111d2c}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions .btn{padding:8px 10px;font-size:11px}.approve{color:#7ef0a0}.wa{color:#7ef0a0}.block{color:#ff9b9b}.unblock{color:#7ef0a0}.empty{text-align:center;color:var(--muted);padding:40px}.toast{position:fixed;right:18px;bottom:18px;background:#18151f;border:1px solid var(--line);padding:13px 16px;border-radius:12px;display:none;max-width:420px}.toast.show{display:block}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px;z-index:50}.modal.show{display:grid}.modalbox{width:min(900px,100%);height:min(90vh,800px);background:#111019;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.modalhead{padding:12px 15px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.proofview{flex:1;display:grid;place-items:center;background:#08070c}.proofview img{max-width:100%;max-height:100%;object-fit:contain}.proofview iframe{width:100%;height:100%;border:0}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="header"><div class="wrap nav"><img class="logo" src="/logo-megahitsbrasil.png"><div><a class="btn" href="/">Site</a> <button class="btn" id="logout">Sair</button></div></div></header><main class="page"><div class="wrap"><div class="top"><div><div class="ey">MEGAHITSBRASIL • ADMIN</div><h1>Painel de controle</h1><div class="muted" id="adminmail"></div></div></div><section class="stats"><div class="stat"><span>FATURAMENTO</span><strong id="revenue">R$ 0,00</strong></div><div class="stat"><span>CLIENTES ATIVOS</span><strong id="paid">0</strong></div><div class="stat"><span>PIX PENDENTES</span><strong id="pending">0</strong></div><div class="stat"><span>RECUSADOS</span><strong id="rejected">0</strong></div><div class="stat"><span>BLOQUEADOS</span><strong id="blocked">0</strong></div></section><div class="tools"><input class="search" id="search" placeholder="Pesquisar por e-mail, WhatsApp ou pedido #"><select class="select" id="filter"><option value="all">Todos</option><option value="pending_pix">PIX pendentes</option><option value="paid">Clientes aprovados</option><option value="rejected">Recusados</option></select><button class="btn" id="refresh">Atualizar</button></div><section class="panel"><div class="panelhead"><strong>Pedidos e clientes</strong><span class="muted" id="count"></span></div><div class="tablewrap"><table class="table"><thead><tr><th>CLIENTE</th><th>VALOR</th><th>STATUS</th><th>COMPROVANTE</th><th>DATA</th><th>AÇÕES</th></tr></thead><tbody id="tbody"></tbody></table></div></section></div></main><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><strong>Comprovante PIX <span id="modalId"></span></strong><button class="btn" id="closeModal">Fechar</button></div><div class="proofview" id="proofview"></div></div></div><script>
const $=id=>document.getElementById(id),tbody=$('tbody');let timer;function money(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format((Number(v)||0)/100)}function dt(v){return v?new Date(v).toLocaleString('pt-BR'):'—'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),3500)}function label(s){return ({pending_pix:'PIX PENDENTE',paid:'APROVADO',rejected:'RECUSADO',pending:'PENDENTE'})[s]||s.toUpperCase()}
async function load(){const q=encodeURIComponent($('search').value.trim()),st=$('filter').value;const r=await fetch(`/api/admin?action=orders&q=${q}&status=${st}`,{cache:'no-store'});if(r.status===401){location='/admin/login.html';return}const d=await r.json();if(!r.ok)throw Error(d.error||'Erro');$('adminmail').textContent=d.adminEmail||'';$('revenue').textContent=money(d.stats.revenue);$('paid').textContent=d.stats.paid;$('pending').textContent=d.stats.pending_pix;$('rejected').textContent=d.stats.rejected;$('blocked').textContent=d.stats.blocked;$('count').textContent=`${d.orders.length} resultado(s)`;tbody.innerHTML='';if(!d.orders.length){tbody.innerHTML='<tr><td colspan="6" class="empty">Nenhum resultado.</td></tr>';return}d.orders.forEach(o=>{const tr=document.createElement('tr');let acts='';if(o.status==='pending_pix'){acts=`<button class="btn approve" data-a="approve" data-id="${o.id}">✓ Aprovar</button><button class="btn danger" data-a="reject" data-id="${o.id}">✕ Recusar</button>`}if(o.status==='paid'){acts+=`<button class="btn wa" data-a="wa" data-id="${o.id}" data-phone="${esc(o.whatsapp)}">WhatsApp</button><button class="btn ${o.access_blocked?'unblock':'block'}" data-a="toggle" data-id="${o.id}" data-blocked="${o.access_blocked}">${o.access_blocked?'Desbloquear':'Bloquear'}</button>`}if(o.has_proof)acts+=`<button class="btn proof" data-a="proof" data-id="${o.id}">Ver comprovante</button>`;tr.innerHTML=`<td class="customer"><strong>${esc(o.email)}</strong><span>WhatsApp: ${esc(o.whatsapp)}</span><span>Pedido #${o.id}</span></td><td>${money(o.amount)}</td><td><span class="pill ${o.status}">${label(o.status)}${o.access_blocked?' • BLOQUEADO':''}</span></td><td>${o.has_proof?'Enviado':'Não enviado'}${o.proof_uploaded_at?`<br><small class="muted">${dt(o.proof_uploaded_at)}</small>`:''}</td><td>${dt(o.created_at)}</td><td><div class="actions">${acts||'—'}</div></td>`;tbody.appendChild(tr)})}
tbody.addEventListener('click',async e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,id=Number(b.dataset.id);try{if(a==='proof'){const r=await fetch(`/api/admin?action=proof&id=${id}`);if(!r.ok)throw Error('Comprovante indisponível.');const blob=await r.blob(),url=URL.createObjectURL(blob);$('modalId').textContent=`#${id}`;$('proofview').innerHTML=blob.type==='application/pdf'?`<iframe src="${url}"></iframe>`:`<img src="${url}" alt="Comprovante">`;$('modal').classList.add('show');return}if(a==='wa'){const msg=`Olá! Seu pagamento do MegaHitsBrasil foi aprovado. 🎉\n\nPedido #${id}\nAcesso liberado!\n\nAcesse sua área do cliente: ${location.origin}/minha-compra.html`;window.open(`https://wa.me/${String(b.dataset.phone).replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`,'_blank');return}let endpoint,body={id};if(a==='approve'){endpoint='/api/admin?action=approve-pix'}else if(a==='reject'){endpoint='/api/admin?action=reject-pix';body.note=prompt('Motivo da recusa (opcional):')||'PIX não confirmado.'}else if(a==='toggle'){endpoint='/api/admin?action=toggle-customer';body.blocked=b.dataset.blocked!=='true';if(!confirm(body.blocked?'Bloquear este cliente?':'Desbloquear este cliente?'))return}b.disabled=true;const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Operação não concluída.');toast(a==='approve'?'Pagamento aprovado. Use o botão WhatsApp para enviar a mensagem.':a==='toggle'?'Acesso atualizado.':a==='reject'?'PIX recusado.':'Concluído.');if(a==='approve'&&d.whatsappUrl)window.open(d.whatsappUrl,'_blank');await load()}catch(err){toast(err.message);b.disabled=false}});$('closeModal').onclick=()=>{$('modal').classList.remove('show');$('proofview').innerHTML=''};$('modal').onclick=e=>{if(e.target.id==='modal')$('closeModal').click()};$('refresh').onclick=()=>load().catch(e=>toast(e.message));$('filter').onchange=()=>load().catch(e=>toast(e.message));$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>load().catch(e=>toast(e.message)),350)};$('logout').onclick=async()=>{await fetch('/api/admin?action=logout',{method:'POST'});location='/admin/login.html'};load().catch(e=>toast(e.message));
</script></body></html>
