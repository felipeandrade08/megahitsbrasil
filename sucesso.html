<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento confirmado — MegaHitsBrasil</title><link rel="icon" href="favicon.png"><style>body{margin:0;background:#080511;color:#fff;font-family:Inter,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(560px,calc(100% - 36px));padding:36px;border:1px solid #27202f;border-radius:24px;background:#100b1b;text-align:center;box-shadow:0 30px 90px #0008}img{width:180px;max-width:70%;height:auto}.ok{font-size:3rem;margin:12px 0}.muted{color:#aaa3b6}.link{display:block;margin:24px 0;padding:16px;border-radius:12px;background:linear-gradient(135deg,#ff1593,#7a3cff);color:#fff;text-decoration:none;font-weight:800}.small{font-size:.78rem;color:#8f8799}</style></head><body><main class="box"><img src="logo-megahitsbrasil.png" alt="MegaHitsBrasil"><div class="ok">✓</div><h1 id="title">Confirmando pagamento...</h1><p class="muted" id="msg">Aguarde enquanto verificamos seu pagamento.</p><a class="link" id="access" href="https://mega.nz/folder/ryZghTYA#vwf3oT_zjy8hJXiFLRQ3hw" target="_blank" rel="noopener" style="display:none">🎵 Acessar meu pacote no MEGA</a><p class="small">Guarde este link em um local seguro.</p></main><script>const id=new URLSearchParams(location.search).get('session_id');async function check(){if(!id){title.textContent='Pagamento não identificado';msg.textContent='Abra novamente o link de pagamento ou fale conosco pelo WhatsApp.';return}try{const r=await fetch('/api/session-status?session_id='+encodeURIComponent(id));const d=await r.json();if(d.paid){title.textContent='Pagamento confirmado!';msg.textContent='Seu acesso já está liberado.';access.style.display='block'}else{title.textContent='Pagamento em processamento';msg.textContent='Assim que o Stripe confirmar o pagamento, o acesso será liberado. Atualize esta página em alguns instantes.'}}catch(e){title.textContent='Não foi possível verificar agor
